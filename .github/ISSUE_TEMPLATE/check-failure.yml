name: Hook, script, or eval runner failure
description: A deterministic hook, validator, sync script, or eval runner fails, hangs, or produces a false positive/negative.
labels: ["bug"]
body:
  - type: input
    id: target
    attributes:
      label: Hook, script, or command
      placeholder: e.g. hooks/engineering/scripts/guard-destructive-git.sh
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command or tool input
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Raw output and exit code (redacted)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Repo version / commit:
        - OS + shell version:
        - Harness + version (or plain shell):
    validations:
      required: true
