name: Skill proposal or change
description: Propose a new skill, a pack addition, or a behavior change to an existing skill.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues/PRs first. Promoted skills must address a concrete failure that frontier models still hit and pass 3-arm evaluation (`full` vs `distilled` vs `none`) before promotion out of `skills/in-progress/`.
  - type: dropdown
    id: pack
    attributes:
      label: Pack
      options:
        - engineering
        - new domain pack (name it below)
        - hooks / guardrails
        - docs
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Concrete failure this answers
      description: What a strong coding agent gets wrong without this skill or change (observed session, production footgun, or contract gap).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed skill or change
      description: "Trigger boundary, Skip clause, core invariants/traps, and whether this should be auto-triggered or user-invoked (`disable-model-invocation: true`)."
    validations:
      required: true
  - type: textarea
    id: eval-seed
    attributes:
      label: Proposed deterministic eval case
      description: A concrete task and objective pass/fail check that separates `with_skill` from `without_skill`.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Why not a hook, linter, or existing skill?
      description: Mechanical invariants belong in hooks/CI; project conventions belong in repo-local checks (`writing-skills` with `references/repo-verification-skills.md`).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Authoring environment
      description: Say whether a human, agent, or both drafted this, with harness + version and model id if an agent helped.
    validations:
      required: true
