name: eval-record

# Verifies that any PR adding, promoting, or editing a promoted skill under
# skills/<pack>/<name>/ has a matching, passing evals/results/<pack>/<name>.json.
# Skips same-repo release (`dev` -> `main`) and back-merge (`main` -> `dev`) PRs.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: eval-record-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        ((github.base_ref == 'main' && github.head_ref == 'dev') ||
         (github.base_ref == 'dev' && github.head_ref == 'main')))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify eval records
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'no-eval') }}
        run: |
          set -euo pipefail
          args=()
          [ "$EXEMPT" = true ] && args+=(--exempt)
          bash scripts/check-eval-record.sh --base "$BASE_SHA" --head "$HEAD_SHA" "${args[@]}"
