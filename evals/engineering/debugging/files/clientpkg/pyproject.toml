[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherkit"
version = "0.4.2"
description = "Client for the station listing API"
requires-python = ">=3.9"

[project.scripts]
weatherkit = "weatherkit.cli:main"

[tool.setuptools.package-data]
weatherkit = ["data/*.json"]
